name: ${COMPOSE_PROJECT_NAME:-mdate-dev}

services:
  frontend:
    build:
      context: ../../src/expo-test
      dockerfile: Dockerfile
    container_name: frontend
    init: true
    working_dir: /app
    command: >-
      sh -lc "npm ci && npx expo start --web --host lan --port 8081"
    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LOCAL_IP:-127.0.0.1}
      EXPO_PUBLIC_API_URL_NATIVE: ${NATIVE_API_ORIGIN:-http://127.0.0.1:8080}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../../src/expo-test:/app
      - expo_node_modules:/app/node_modules
      - expo_cache:/root/.expo
    ports:
      # Expo Metro is exposed to the LAN for a physical Android tablet/dev client.
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${EXPO_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  backend:
    build:
      context: ../../src/express-test
      dockerfile: Dockerfile
    container_name: backend
    init: true
    working_dir: /app
    command: >-
      sh -lc "npm ci && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mdate}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@sql:5432/${POSTGRES_DB:-mdate}
      EXPO_WEB_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:8080}
      MEDIA_STORAGE_DIR: /app/storage/media
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the root .env}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.mdate.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mdate-app}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost:8080/reset-password}
      EMAIL_CHANGE_BASE_URL: ${EMAIL_CHANGE_BASE_URL:-http://localhost:8080/confirm-email-change}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://${LOCAL_IP:-127.0.0.1}:${MINIO_PORT:-9000}}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MINIO_APP_USER in the root .env}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD in the root .env}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET_AUDIO: mdate-audio
      MINIO_BUCKET_ASSETS: mdate-assets
      MINIO_BUCKET_EXPORTS: mdate-exports
      MINIO_PRESIGNED_URL_TTL_SECONDS: ${MINIO_PRESIGNED_URL_TTL_SECONDS:-300}
      PYTHON_EXECUTABLE: /opt/md-venv/bin/python
      MDATE_WHISPER_MODEL_DIR: /models/whisper-aphasia
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: ${WHISPER_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${WHISPER_CPU_THREADS:-4}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-MDATE <no-reply@example.com>}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../../src/express-test:/app
      - backend_node_modules:/app/node_modules
      - ../../src/express-test/models/whisper-aphasia:/models/whisper-aphasia:ro
      - ../../src/express-test/storage/media:/app/storage/media
    depends_on:
      sql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  sql:
    build:
      context: ../../infra/postgres
      dockerfile: Dockerfile
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:-mdate}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Redis is intentionally internal and ephemeral. The current API does not
    # yet instantiate a Redis client; this service is infrastructure only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the root .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the root .env}
      # Community Edition uses server-wide CORS rather than bucket-level CORS.
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_CORS_ALLOWED_ORIGINS:-${APP_PUBLIC_ORIGIN:-http://localhost:8080}}"
    ports:
      # The S3 API is published on the LAN for native-device presigned uploads.
      # For public access, use the storage hostname through Cloudflare Tunnel.
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    build:
      context: ../../infra/minio-init
      dockerfile: Dockerfile
    image: mdate-minio-init:dev
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the root .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the root .env}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MINIO_APP_USER in the root .env}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD in the root .env}
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    volumes:
      - ../scripts/init-minio.sh:/scripts/init-minio.sh:ro
    restart: "no"

  proxy:
    build:
      context: ../../infra/nginx
      dockerfile: Dockerfile
    container_name: nginx
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:-localhost}
      STORAGE_HOSTNAME: ${STORAGE_HOSTNAME:-storage.example.com}
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${NGINX_HTTP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    profiles: ["tunnel"]
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: mdate-dev-postgres-data
  minio_data:
    name: mdate-dev-minio-data
  expo_node_modules:
    name: mdate-dev-expo-node-modules
  backend_node_modules:
    name: mdate-dev-backend-node-modules
  expo_cache:
    name: mdate-dev-expo-cache
