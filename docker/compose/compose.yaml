services:
  frontend:
      build:
        context: ../../src/frontend
        dockerfile: Dockerfile
      container_name: frontend
      ports:
        - "8081:8081"
      environment:
        NODE_ENV: development
        # Force Metro bundler to bind to 0.0.0.0 inside container
        EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
        # Set this to your local machine IP so physical devices/emulators can connect
        REACT_NATIVE_PACKAGER_HOSTNAME: "${LOCAL_IP:-127.0.0.1}"
        WATCHPACK_POLLING: "true"
        CHOKIDAR_USEPOLLING: "true"
      volumes:
        - ../../src/frontend:/app
        - /app/node_modules
      stdin_open: true # Keeps Expo interactive CLI active
      tty: true
      depends_on:
        - backend

  backend:
    build:
      context: ../../src/backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sql:5432/${POSTGRES_DB}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../../src/backend:/app
      - /app/node_modules
    depends_on:
      sql:
        condition: service_healthy

  sql:
    build:
      context: ../../infra/postgres
      dockerfile: Dockerfile
    container_name: postgres
    env_file:
      - ../../.env
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  object-storage:
    image: pgsty/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  cache:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data

  proxy:
    build:
      context: ../../infra/nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../infra/nginx/letsencrypt:/etc/letsencrypt:ro
      - ../../infra/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ../../infra/nginx/certbot/www:/var/www/certbot
      - ../../infra/nginx/letsencrypt:/etc/letsencrypt

  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Add MINIO_ROOT_USER to the project-root .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Add MINIO_ROOT_PASSWORD to the project-root .env file}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - mdate-minio-data:/data
    restart: unless-stopped

  minio-init:
    image: alpine:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Add MINIO_ROOT_USER to the project-root .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Add MINIO_ROOT_PASSWORD to the project-root .env file}
      MINIO_APP_USER: ${MINIO_APP_USER:?Add MINIO_APP_USER to the project-root .env file}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Add MINIO_APP_PASSWORD to the project-root .env file}
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache curl && curl https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/bin/mc && chmod +x /usr/bin/mc && sh /scripts/init-minio.sh"]
    volumes:
      - ../scripts/init-minio.sh:/scripts/init-minio.sh:ro
    restart: "no"

volumes:
  postgres_data:
  mongodb_data:
  minio_data:
  redis_data:
  mdate-minio-data:
